server {
    listen 80;
    server_name _;

    # Static files come from the shared volume each colour publishes into.
    # Vite fingerprints filenames, so the two colours coexist there and a
    # request for an old asset keeps working through the switch.
    root /srv/public;
    index index.php;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app;
        fastcgi_index index.php;
        include fastcgi_params;

        # Absolute, not $document_root: the script runs inside the app
        # container, where the application lives at a different path than the
        # static files do here.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
