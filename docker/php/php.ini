; Production defaults. Everything here is a deliberate choice, not a copy of
; the php.ini-production file.

expose_php = Off
memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 8M
post_max_size = 9M

; The image ships compiled code that never changes at runtime, so the timestamp
; check is pure syscalls. Deploying a new colour means a new container, which
; means a cold cache, which is the point of not reloading in place.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Errors go to the log, never to the response.
display_errors = Off
log_errors = On
error_log = /dev/stderr
